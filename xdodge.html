<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Xdodge</title>
<style>
:root{--ground:#0d0717;--bezel:#1e1331;--bezel-hi:#3b2759;--s:3;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ground);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 38%,#26163c 0%,#140b22 55%,#0d0717 100%);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;line-height:0;border-radius:3px;box-shadow:0 0 0 3px var(--bezel),0 0 0 5px var(--bezel-hi),0 0 0 8px #0a0512,0 24px 60px rgba(0,0,0,.65),0 0 90px rgba(180,74,103,.18)}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 66%,rgba(10,4,20,.17) 66%);background-size:100% calc(var(--s) * 1px)}
.scan.off{display:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(8,3,16,.42) 100%)}
</style>
</head>
<body>
<div id="stage"><div id="frame"><canvas id="game" width="384" height="288" tabindex="0" aria-label="Xdodge. Move with arrow keys or WASD, dodge roll with Space, P to pause, M to mute."></canvas><div class="scan" id="scan"></div><div class="vig"></div></div></div>
<script>
(()=>{
'use strict';
/* ================= core ================= */
const W=384,H=288,TAU=Math.PI*2;
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),frame=document.getElementById('frame'),stage=document.getElementById('stage'),scan=document.getElementById('scan');
ctx.imageSmoothingEnabled=false;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse=matchMedia('(pointer: coarse)').matches;
const P={ink:'#120b1f',plum:'#1c1030',plum2:'#2a1846',plum3:'#43255f',rose:'#e0708a',cream:'#fff1c9',gold:'#ffc94a',dim:'#9d86b8',
 g1:'#6cbd44',g2:'#62b03e',g3:'#4f9834',gLip:'#9ee063',gDark:'#2e6b2c',gDark2:'#3c8433',gDeep:'#1d4a22',tuft:'#8ad455',
 dirt1:'#8a5530',dirt2:'#643a22',dirt3:'#43251a',stone:'#9a8e86',stone2:'#6b605c',
 navy:'#262a52',navyHi:'#3f4a8e',navyDk:'#181a38',foot:'#0e0d20',skin:'#f3c595',band:'#ff4b3e',bandDk:'#b8243a',hilt:'#6b3f2c',steel:'#c9cde6',
 bomb:'#1f1b2c',bombHi:'#5a5680',fuse:'#d9b27a',
 fx1:'#fffbe6',fx2:'#ffe066',fx3:'#ff9a2e',fx4:'#e8452c',smoke:'#3b3049',smoke2:'#5e4c70',warn:'#ff3b5c',
 ice:'#bfefff',iceHi:'#ffffff',iceMid:'#7fd4f5',iceDk:'#3d8fc4',slime:'#b45cf0',slimeHi:'#e6a8ff',slimeDk:'#7a2fb8',slimeDeep:'#4e1d80'};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
const pad=(n,l)=>String(Math.max(0,Math.floor(n))).padStart(l,'0');
const fmtTime=s=>pad(s/60,2)+':'+pad(s%60,2);
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return[c,x]}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const dith=(x,y,t)=>t*16>BAYER[(y&3)*4+(x&3)]+.5;
function disc(g,cx,cy,r){if(r<.5){g.fillRect(Math.round(cx),Math.round(cy),1,1);return}const rr=r*r,fr=Math.floor(r),x0=Math.round(cx),y0=Math.round(cy);for(let dy=-fr;dy<=fr;dy++){const w=Math.floor(Math.sqrt(rr-dy*dy));g.fillRect(x0-w,y0+dy,w*2+1,1)}}
function line(g,x0,y0,x1,y1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;for(;;){g.fillRect(x0,y0,1,1);if((x0===x1&&y0===y1)||++n>200)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
const RINGS=new Map();
function ringPts(r){r=Math.max(1,Math.round(r));let a=RINGS.get(r);if(a)return a;a=[];const seen=new Set();const add=(px,py)=>{const k=px+','+py;if(!seen.has(k)){seen.add(k);a.push([px,py,Math.atan2(py,px)])}};
 let x=r,y=0,e=1-r;while(x>=y){add(x,y);add(y,x);add(-y,x);add(-x,y);add(-x,-y);add(-y,-x);add(y,-x);add(x,-y);y++;if(e<0)e+=2*y+1;else{x--;e+=2*(y-x)+1}}
 a.sort((p,q)=>p[2]-q[2]);RINGS.set(r,a);return a}
function shadow(g,x,y,w){x=Math.round(x);y=Math.round(y);const hw=Math.floor(w/2);g.fillStyle='rgba(10,34,12,.38)';g.fillRect(x-hw+1,y-1,w-2,1);g.fillRect(x-hw,y,w,1);g.fillRect(x-hw+1,y+1,w-2,1)}

/* ================= pixel font (no fonts — every glyph is hand-drawn bits) ================= */
const F5={
'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],
'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[28,18,17,17,17,18,28],E:[31,16,16,30,16,16,31],
F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],
K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],
P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],
U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],Y:[17,17,17,10,4,4,4],
Z:[31,1,2,4,8,16,31],':':[0,12,12,0,12,12,0],'!':[4,4,4,4,4,0,4],'.':[0,0,0,0,0,12,12],'-':[0,0,0,31,0,0,0],
'/':[1,1,2,4,8,16,16],'+':[0,4,4,31,4,4,0],'?':[14,17,1,2,4,0,4],'>':[8,4,2,1,2,4,8],'<':[2,4,8,16,8,4,2],'*':[0,0,4,14,4,0,0],' ':[0,0,0,0,0,0,0]};
function drawText(g,s,x,y,sc){let cx=x;for(const ch of s){const gl=F5[ch];if(gl)for(let r=0;r<7;r++){const row=gl[r];if(row)for(let c=0;c<5;c++)if(row&(16>>c))g.fillRect(cx+c*sc,y+r*sc,sc,sc)}cx+=6*sc}}
const textW=(s,sc)=>s.length?(s.length*6-1)*sc:0;
const TC=new Map();
function txt(s,col,sc,ol){s=String(s).toUpperCase();const k=s+'|'+col+'|'+sc+'|'+ol;let c=TC.get(k);if(c)return c;
 const [cc,x]=mk(Math.max(1,textW(s,sc)+2*sc),10*sc);
 if(ol){x.fillStyle='#2a0f36';for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++)drawText(x,s,dx*sc,(dy+1)*sc,sc);
  x.fillStyle=ol;for(let dy=0;dy<3;dy++)for(let dx=0;dx<3;dx++)if(dx!==1||dy!==1)drawText(x,s,dx*sc,dy*sc,sc)}
 x.fillStyle=col;drawText(x,s,sc,sc,sc);
 if(TC.size>500)TC.clear();TC.set(k,cc);return cc}
function putText(g,s,x,y,col,sc=1,align='left',ol=P.ink){const c=txt(s,col,sc,ol);const ox=align==='center'?Math.round(x-c.width/2):align==='right'?x-c.width+sc:x-sc;g.drawImage(c,ox,y-sc);return c.width}

/* ================= title logo: chunky 7x7 letters, banded fill, extruded & outlined ================= */
const L7={X:[99,99,54,28,54,99,99],D:[124,102,99,99,99,102,124],O:[62,99,99,99,99,99,62],G:[62,99,96,111,99,99,62],E:[127,96,96,126,96,96,127]};
const LOGO=(()=>{const word='XDODGE',sc=5,adv=8,lw=(word.length*adv-1)*sc,lh=7*sc,depth=6,pad=3,cw=lw+pad*2+4,ch=lh+pad*2+depth;
 const bandsX=['#ffb3a1','#ff6a52','#ff4b3e','#e8323f','#c8243f','#a01c3c','#7c1636'];
 const bandsD=['#fff6d8','#ffe597','#ffc94a','#ffb03c','#f58f34','#e2692f','#bf482c'];
 const [face,fx]=mk(lw,lh);
 for(let i=0;i<word.length;i++){const gl=L7[word[i]],bands=i===0?bandsX:bandsD;
  for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(gl[r]&(64>>c)){const px=(i*adv+c)*sc,py=r*sc;fx.fillStyle=bands[r];fx.fillRect(px,py,sc,sc);
   if(r===0||!(gl[r-1]&(64>>c))){fx.fillStyle='rgba(255,255,255,.6)';fx.fillRect(px,py,sc,1)}
   if(c===0||!(gl[r]&(64>>(c-1)))){fx.fillStyle='rgba(255,255,255,.22)';fx.fillRect(px,py,1,sc)}}}
 const tint=(src,col,w,h)=>{const [c,x]=mk(w,h);x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,w,h);return c};
 const sil=tint(face,'#fff',lw,lh),ext=tint(face,'#5a1f55',lw,lh),ext2=tint(face,'#2e1238',lw,lh);
 const [body,bx]=mk(cw,ch);
 for(let d=depth;d>=1;d--)bx.drawImage(d>3?ext2:ext,pad+Math.round(d*.5),pad+d);
 bx.drawImage(face,pad,pad);
 const bs=tint(body,P.ink,cw,ch);const [out,ox]=mk(cw,ch);
 for(const[dx,dy]of[[-2,0],[2,0],[0,-2],[0,2],[-1,-1],[1,-1],[-1,1],[1,1],[-2,1],[2,1],[-1,2],[1,2],[-2,-1],[2,-1],[-1,-2],[1,-2]])ox.drawImage(bs,dx,dy);
 ox.drawImage(body,0,0);
 return{canvas:out,sil,bx:pad,by:pad,w:cw,h:ch,lw,lh}})();
const [shineC,shineX]=mk(LOGO.lw,LOGO.lh);
function drawLogo(g,x,y,t){g.drawImage(LOGO.canvas,x,y);const p=(t%3.4)/1.1;if(p>=1)return;
 shineX.globalCompositeOperation='source-over';shineX.clearRect(0,0,LOGO.lw,LOGO.lh);shineX.drawImage(LOGO.sil,0,0);
 shineX.globalCompositeOperation='source-in';shineX.fillStyle='rgba(255,255,255,.7)';shineX.beginPath();
 const sx=Math.round(lerp(-30,LOGO.lw+30,p));for(let r=0;r<LOGO.lh;r++){const o=sx-Math.round(r*.6);shineX.rect(o,r,7,1);shineX.rect(o+10,r,2,1)}
 shineX.fill();g.drawImage(shineC,x+LOGO.bx,y+LOGO.by)}
/* ================= chiptune sfx (synthesized, starts on first key/tap) ================= */
const AU={ctx:null,master:null,noise:null,muted:false};
function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
 try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const a=new AC();AU.ctx=a;AU.master=a.createGain();AU.master.gain.value=AU.muted?0:.32;AU.master.connect(a.destination);
  const len=a.sampleRate;AU.noise=a.createBuffer(1,len,a.sampleRate);const d=AU.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}catch(e){AU.ctx=null}}
function tone(f,dur,type='square',vol=.2,slide=1,delay=0){const a=AU.ctx;if(!a||AU.muted)return;if(AU.quiet)vol*=.3;try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function hiss(dur,vol=.4,freq=1600,sweep=.2,delay=0){const a=AU.ctx;if(!a||AU.muted||!AU.noise)return;if(AU.quiet)vol*=.3;try{const t=a.currentTime+delay,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=AU.noise;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,freq*sweep),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*.4);s.stop(t+dur+.05)}catch(e){}}
let lastWhistle=0,lastBoom=0;
const SFX={
 roll(){hiss(.16,.22,3200,.25);tone(420,.09,'square',.05,.55)},
 thrown(){const n=performance.now();if(n-lastWhistle<120)return;lastWhistle=n;tone(1100,.5,'triangle',.05,.4)},
 land(){tone(160,.07,'square',.09,.5)},
 boom(){const n=performance.now();const v=n-lastBoom<60?.35:.7;lastBoom=n;hiss(.65,v,2600,.05);tone(96,.35,'square',.18*v,.3)},
 start(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.1,1,i*.08))},
 go(){tone(1047,.25,'square',.1,1);tone(1568,.25,'square',.06,1,.02)},
 ready(){tone(523,.1,'square',.08)},
 level(){[660,880,1320].forEach((f,i)=>tone(f,.1,'square',.09,1,i*.07))},
 hit(){tone(320,.55,'sawtooth',.18,.2);hiss(.45,.4,1500,.1)},
 over(){[392,330,262,196].forEach((f,i)=>tone(f,.24,'square',.1,1,.35+i*.18))},
 nice(){tone(1320,.06,'square',.07);tone(1760,.09,'square',.07,1,.06)},
 close(){tone(990,.05,'square',.05)},
 blip(){tone(880,.05,'square',.07)},
 pause(){tone(660,.06,'square',.07);tone(440,.08,'square',.07,1,.07)},
 freezeBoom(){hiss(.5,.45,6000,.3);[1760,2349,2637].forEach((f,i)=>tone(f,.25,'triangle',.05,1,i*.04))},
 freeze(){tone(1200,.4,'sine',.12,.4);tone(2400,.2,'triangle',.05,.8,.05)},
 shatter(){hiss(.25,.3,7000,.4);tone(1800,.1,'square',.05,.5)},
 splat(){hiss(.35,.5,900,.15);tone(180,.25,'sine',.2,.4)},
 slimed(){tone(220,.3,'sine',.15,.5);tone(160,.3,'sine',.1,.6,.1)},
 combo(m){(m===20?[523,659,784,1047,1319,1568,2093]:m===5?[523,784,1047,1319]:[659,988]).forEach((f,i)=>tone(f,.1,'square',.1,1,i*.06))},
 lost(){tone(440,.12,'square',.06,.6);tone(330,.18,'square',.06,.6,.1)},
 intro(){tone(880,.08,'square',.08);tone(1175,.12,'square',.08,1,.09)}};
function setMuted(m){AU.muted=m;if(AU.master)AU.master.gain.value=m?0:.32}

/* ================= input: keyboard + touch stick ================= */
const keys=new Set(),pressed=new Set();
addEventListener('keydown',e=>{const k=e.code;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();if(!e.repeat)pressed.add(k);keys.add(k);audioInit()});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();if(G.state==='play')setPause(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')setPause(true)});
const hit=(...c)=>c.some(k=>pressed.has(k));
const down=(...c)=>c.some(k=>keys.has(k));
const TP={id:-1,sx:0,sy:0,x:0,y:0,t0:0,moved:false},TAP={x:-1,y:-1};
function setTap(cx,cy){const r=cv.getBoundingClientRect();TAP.x=(cx-r.left)/r.width*W;TAP.y=(cy-r.top)/r.height*H;pressed.add('Tap')}
stage.addEventListener('pointerdown',e=>{audioInit();cv.focus({preventScroll:true});if(e.pointerType==='mouse'){if(e.button===0)setTap(e.clientX,e.clientY);return}
 e.preventDefault();if(TP.id===-1){TP.id=e.pointerId;TP.sx=TP.x=e.clientX;TP.sy=TP.y=e.clientY;TP.t0=performance.now();TP.moved=false}else setTap(e.clientX,e.clientY)});
stage.addEventListener('pointermove',e=>{if(e.pointerId!==TP.id)return;TP.x=e.clientX;TP.y=e.clientY;if(Math.hypot(TP.x-TP.sx,TP.y-TP.sy)>10)TP.moved=true});
const tpEnd=e=>{if(e.pointerId!==TP.id)return;if(!TP.moved&&performance.now()-TP.t0<260)setTap(TP.sx,TP.sy);TP.id=-1};
stage.addEventListener('pointerup',tpEnd);stage.addEventListener('pointercancel',tpEnd);
function inputVec(){let x=(down('ArrowRight','KeyD')?1:0)-(down('ArrowLeft','KeyA')?1:0),y=(down('ArrowDown','KeyS')?1:0)-(down('ArrowUp','KeyW')?1:0);
 if(TP.id!==-1&&TP.moved){const dx=TP.x-TP.sx,dy=TP.y-TP.sy,d=Math.hypot(dx,dy)||1,m=Math.min(1,d/36);x+=dx/d*m;y+=dy/d*m}
 const l=Math.hypot(x,y);return l>1?[x/l,y/l]:[x,y]}

/* ================= world: floating pasture island ================= */
const PX=88,PY=48,PS=208,TS=8,NT=26,CX=PX+PS/2,CY=PY+PS/2;
const world={rough:new Uint8Array(NT*NT),ground:null,face:null,tufts:[],scorch:[],hazards:[]};
const roughTile=(tx,ty)=>tx>=0&&ty>=0&&tx<NT&&ty<NT&&world.rough[ty*NT+tx]===1;
const isRoughAt=(x,y)=>roughTile(Math.floor((x-PX)/TS),Math.floor((y-PY)/TS));
function genWorld(){const R=world.rough;R.fill(0);const n=irnd(6,8);
 const nearCenter=(x,y)=>Math.abs(x-12.5)<2.6&&Math.abs(y-12.5)<2.6;
 for(let i=0;i<n;i++){let cx,cy,tries=0;do{cx=irnd(1,NT-2);cy=irnd(1,NT-2);tries++}while(Math.abs(cx-12.5)<4.5&&Math.abs(cy-12.5)<4.5&&tries<60);
  const cells=[[cx,cy]];R[cy*NT+cx]=1;const size=irnd(7,16);
  for(let k=0;k<size*4&&cells.length<size;k++){const [bx,by]=pick(cells),d=pick([[1,0],[-1,0],[0,1],[0,-1]]),nx=bx+d[0],ny=by+d[1];
   if(nx<0||ny<0||nx>=NT||ny>=NT||nearCenter(nx,ny)||R[ny*NT+nx])continue;R[ny*NT+nx]=1;cells.push([nx,ny])}}
 world.tufts=[];for(let ty=0;ty<NT;ty++)for(let tx=0;tx<NT;tx++)if(R[ty*NT+tx]){const k=irnd(1,2);for(let j=0;j<k;j++)world.tufts.push({x:PX+tx*TS+irnd(1,6),y:PY+ty*TS+irnd(3,7),ph:rnd(TAU),h:irnd(3,5)})}
 world.tufts.sort((a,b)=>a.y-b.y);world.scorch=[];world.hazards=[];world.ground=renderGround();if(!world.face)world.face=renderFace()}

function drawTitle(){const t=G.stateT;
 for(let y=0;y<112;y+=4){ctx.globalAlpha=.66*(1-y/112);ctx.fillStyle=P.ink;ctx.fillRect(0,y,W,4)}ctx.globalAlpha=1;
 const k=clamp(t/1,0,1),ly=Math.round(lerp(-70,18,easeOutBounce(k))+(k>=1?Math.sin(G.clock*1.6)*1.5:0));
 drawLogo(ctx,Math.round(W/2-LOGO.w/2),ly,Math.max(0,t-1));
 if(t>1.05){putText(ctx,'DODGE * ROLL * SURVIVE',W/2,ly+LOGO.h+4,P.rose,1,'center');
  const bs=best(),msg=bs?bs.n+'  '+pad(bs.s,6):'NO RECORD YET',w=Math.max(textW(msg,1),textW('TOP NINJA',1))+44,bx=Math.round(W/2-w/2),py=ly+LOGO.h+16;
  ctx.fillStyle=P.ink;ctx.fillRect(bx-1,py-1,w+2,25);ctx.fillStyle='rgba(42,24,70,.92)';ctx.fillRect(bx,py,w,23);ctx.fillStyle=P.plum3;ctx.fillRect(bx,py,w,1);
  putText(ctx,'TOP NINJA',W/2,py+3,P.dim,1,'center',null);putText(ctx,msg,W/2,py+13,bs?P.gold:P.cream,1,'center');
  if(bs){drawCrown(ctx,bx+7,py+13);drawCrown(ctx,bx+w-14,py+13)}}
 if(t>1.2&&(G.clock%1.1)<.78){const msg=coarse?'TAP TO START':'PRESS SPACE TO START',w=textW(msg,1)+28,bx=Math.round(W/2-w/2),o=Math.round(Math.sin(G.clock*7));
  ctx.fillStyle=P.ink;ctx.fillRect(bx-1,196,w+2,15);ctx.fillStyle=P.plum2;ctx.fillRect(bx,197,w,13);ctx.fillStyle=P.plum3;ctx.fillRect(bx,197,w,1);
  putText(ctx,msg,W/2,200,P.cream,1,'center',null);putText(ctx,'>',bx+4+o,200,P.gold,1,'left',null);putText(ctx,'<',bx+w-9-o,200,P.gold,1,'left',null)}
 ctx.fillStyle='rgba(18,11,31,.74)';ctx.fillRect(W/2-88,219,176,46);
 putText(ctx,coarse?'DRAG':'ARROWS/WASD',W/2-6,223,P.gold,1,'right');putText(ctx,'MOVE',W/2+6,223,P.cream,1);
 putText(ctx,coarse?'TAP':'SPACE',W/2-6,235,P.gold,1,'right');putText(ctx,'DODGE ROLL',W/2+6,235,P.cream,1);
 for(const L of LEGEND){drawBomb(ctx,L.b);putText(ctx,L.s,L.b.x+8,250,L.c,1)}
 button(BTN.rank,coarse?'RANKING':'B RANKING',false);button(BTN.sound,(coarse?'':'M ')+'SOUND '+(AU.muted?'OFF':'ON'),false)}
function drawPause(){ctx.fillStyle='rgba(18,11,31,.62)';ctx.fillRect(0,0,W,H);putText(ctx,'PAUSED',W/2,110,P.cream,3,'center');putText(ctx,coarse?'TAP TO RESUME':'P  RESUME',W/2,146,P.gold,1,'center');if(!coarse)putText(ctx,'Q  QUIT TO TITLE',W/2,158,P.dim,1,'center')}
function panel(x,y,w,h){ctx.fillStyle=P.ink;ctx.fillRect(x-3,y-1,w+6,h+2);ctx.fillRect(x-1,y-3,w+2,h+6);ctx.fillStyle='#4a2d6b';ctx.fillRect(x-2,y,w+4,h);ctx.fillRect(x,y-2,w,h+4);ctx.fillStyle=P.plum2;ctx.fillRect(x,y,w,h);ctx.fillStyle=P.plum3;ctx.fillRect(x,y,w,1);ctx.fillStyle=P.plum;ctx.fillRect(x,y+h-1,w,1)}
function drawOver(){const k=easeOutCubic(clamp(G.stateT/.4,0,1));ctx.fillStyle='rgba(18,11,31,'+(.55*k)+')';ctx.fillRect(0,0,W,H);
 const x=82,w=220,h=150,y=Math.round(lerp(H+10,66,k)),bs=best();panel(x,y,w,h);
 putText(ctx,'GAME OVER',W/2,y+10,P.band,3,'center');
 [['SCORE',pad(G.final,6),P.cream],['TOP NINJA',bs?bs.n+' '+pad(bs.s,6):'------',P.gold],['TIME',fmtTime(G.survive),P.cream],['LEVEL',pad(G.level,2),P.cream],['PERFECT DODGES',String(G.perfects),P.cream],['BEST STREAK',String(G.bestStreak),P.cream]]
  .forEach(([l,v,c],i)=>{const ry=y+40+i*11;putText(ctx,l,x+16,ry,P.dim,1);putText(ctx,v,x+w-16,ry,c,1,'right')});
 if(!coarse)putText(ctx,'SPACE RETRY  B RANKING  ESC TITLE',W/2,y+112,P.dim,1,'center');
 const O=overButtons(y);button(O.retry,'RETRY',true);button(O.ranking,'RANKING',false);button(O.title,'TITLE',false)}
function drawBoard(){const k=easeOutCubic(clamp(G.stateT/.35,0,1)),oy=Math.round((1-k)*16);ctx.fillStyle='rgba(18,11,31,'+(.74*k)+')';ctx.fillRect(0,0,W,H);
 putText(ctx,'HALL OF FAME',W/2,14-oy,P.gold,3,'center');
 const x0=72,top=50+oy,cols=[x0+14,x0+54,x0+96,x0+156,x0+196],hy=top+7;panel(x0,top,240,190);
 [['RANK',0],['NAME',1],['SCORE',2],['LV',3],['TIME',4]].forEach(([s,i])=>putText(ctx,s,cols[i],hy,P.dim,1,'left',null));
 ctx.fillStyle=P.plum3;ctx.fillRect(x0+8,hy+10,224,1);
 for(let i=0;i<10;i++){const e=board[i],ry=hy+16+i*17,me=i===G.rank&&G.boardFrom==='entry',col=i<3?RANKCOL[i]:P.cream;
  if(me){if(Math.floor(G.clock*4)%2===0){ctx.fillStyle='#4a2d6b';ctx.fillRect(x0+4,ry-3,232,13)}putText(ctx,'>',x0+5+Math.round(Math.sin(G.clock*8)),ry,P.gold,1,'left',null)}
  putText(ctx,RANK[i],cols[0],ry,col,1);
  if(e){putText(ctx,e.n,cols[1],ry,me?P.gold:P.cream,1);putText(ctx,pad(e.s,6),cols[2],ry,col,1);putText(ctx,pad(e.l,2),cols[3],ry,P.dim,1);putText(ctx,fmtTime(e.t),cols[4],ry,P.dim,1);if(i===0)drawCrown(ctx,cols[1]+22,ry)}
  else{putText(ctx,'---',cols[1],ry,'#5b4a78',1,'left',null);putText(ctx,'------',cols[2],ry,'#5b4a78',1,'left',null)}}
 const B=boardButtons();button(B.play,'PLAY',true);button(B.back,'BACK',false);if(B.gc)button(B.gc,'GAME CENTER',false);
 if(!coarse)putText(ctx,'SPACE PLAY   ESC BACK'+(B.gc?'   G GAME CENTER':''),W/2,272,P.dim,1,'center')}
function drawEntry(){const E=G.entry;ctx.fillStyle='rgba(18,11,31,.7)';ctx.fillRect(0,0,W,H);panel(86,24,212,226);
 putText(ctx,'NEW HIGH SCORE!',W/2,32,RAINBOW[Math.floor(G.clock*10)%6],2,'center');
 let r=board.findIndex(e=>G.final>e.s);if(r<0)r=board.length;
 putText(ctx,RANK[r]+' PLACE   '+pad(G.final,6),W/2,54,P.cream,1,'center');
 putText(ctx,'TIME '+fmtTime(G.survive)+'  LV '+pad(G.level,2)+'  STREAK '+G.bestStreak,W/2,65,P.dim,1,'center');
 for(let i=0;i<3;i++){const x=154+i*28,cur=E.cur<3&&i===E.cur;putText(ctx,E.ch[i],x,80,P.gold,4);ctx.fillStyle=cur?(Math.floor(G.clock*4)%2===0?P.gold:P.plum3):P.plum3;ctx.fillRect(x,111,20,3)}
 for(let gy=0;gy<5;gy++)for(let gx=0;gx<(gy<4?7:2);gx++){const cx=gy<4?gx:(gx?5:0),c=gridCell(cx,gy),sel=!coarse&&E.gy===gy&&(gy<4?E.gx===gx:(E.gx<=3?0:1)===gx);button(c,c.ch,sel)}
 putText(ctx,coarse?'TAP LETTERS - THEN END':'TYPE YOUR NAME - ENTER TO SAVE',W/2,226,P.dim,1,'center')}
function drawTouchStick(){if(TP.id===-1||!TP.moved||G.state!=='play')return;const r=cv.getBoundingClientRect(),gx=c=>(c-r.left)/r.width*W,gy=c=>(c-r.top)/r.height*H;
 const ax=gx(TP.sx),ay=gy(TP.sy),dx=gx(TP.x)-ax,dy=gy(TP.y)-ay,d=Math.hypot(dx,dy)||1,m=Math.min(d,14);
 ctx.globalAlpha=.5;ctx.fillStyle=P.cream;for(const p of ringPts(14))ctx.fillRect(Math.round(ax)+p[0],Math.round(ay)+p[1],1,1);ctx.fillStyle=P.gold;disc(ctx,ax+dx/d*m,ay+dy/d*m,4);ctx.globalAlpha=1}
function render(real){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
 const cdt=G.state==='paused'?0:real;
 ctx.drawImage(SKY,0,0);drawStars(ctx,G.clock);drawClouds(ctx,0,cdt);drawClouds(ctx,1,cdt);
 const s=G.shake;ctx.setTransform(1,0,0,1,Math.round(rnd(-s,s)),Math.round(rnd(-s,s)));
 ctx.fillStyle=P.ink;ctx.fillRect(PX-1,PY,PS+2,PS);ctx.fillRect(PX,PY-1,PS,1);
 ctx.drawImage(world.face,PX,PY+PS);ctx.drawImage(world.ground,PX,PY);
 ctx.save();ctx.beginPath();ctx.rect(PX,PY,PS,PS);ctx.clip();drawScorch(ctx);drawHazards(ctx);ctx.restore();
 drawTargets(ctx);drawTufts(ctx);
 shadow(ctx,N.x,N.y,N.roll?12:Math.max(6,10-Math.round(N.z*.05)));
 for(const b of bombs)drawBombShadow(ctx,b);
 const ents=bombs.filter(b=>b.t>=0&&b.landed);ents.push(N);ents.sort((a,b)=>a.y-b.y);
 for(const e of ents){if(e===N)drawNinja(ctx);else drawBomb(ctx,e)}
 for(const e of blasts)drawBlast(ctx,e);
 drawParts(ctx);
 for(const b of bombs)if(b.t>=0&&!b.landed)drawBomb(ctx,b);
 drawPops(ctx);drawClouds(ctx,2,cdt);
 ctx.setTransform(1,0,0,1,0,0);
 if(G.state==='play')drawWarns(ctx);
 if(G.flash>0){ctx.globalAlpha=Math.min(1,G.flash)*.7;ctx.fillStyle=P.fx1;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
 if(G.state==='title')drawTitle();else if(G.state==='board')drawBoard();else if(G.state==='entry')drawEntry();
 else{drawHUD();if(G.state==='play')drawPlayOverlay();else if(G.state==='paused')drawPause();else if(G.state==='over')drawOver()}
 drawTouchStick()}
/* ================= loop & boot ================= */
function fit(){const aw=innerWidth-32,ah=innerHeight-32;let s=Math.min(aw/W,ah/H);if(s>=1&&!coarse&&!window.xdodgeNative)s=Math.floor(s);s=Math.max(.5,s);
 cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';frame.style.setProperty('--s',String(s));scan.classList.toggle('off',s<2)}
addEventListener('resize',fit);
let last=0,booted=false;
function loop(now){let dt=last?Math.min(.05,(now-last)/1000):0;last=now;const real=dt;if(G.slowT>0){G.slowT-=dt;dt*=G.slow}
 update(dt);render(real);pressed.clear();requestAnimationFrame(loop)}
function start(){if(booted)return;booted=true;const legacy=loadHi();if(!board.length&&legacy>0){board.push({n:'YOU',s:legacy,l:1,t:0,st:0});saveBoard()}
 G.hi=board.length?board[0].s:0;fit();toTitle();try{cv.focus({preventScroll:true})}catch(e){}requestAnimationFrame(loop)}
start();
})();
